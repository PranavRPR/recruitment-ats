services:
  postgres:
    image: postgres:17
    container_name: recruitment-ats-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: recruitment_ats
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - recruitment_pgdata:/var/lib/postgresql/data

volumes:
  recruitment_pgdata:

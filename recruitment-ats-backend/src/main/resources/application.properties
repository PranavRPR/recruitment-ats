spring.application.name=recruitment-ats-backend

server.port=8080

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/recruitment_ats}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:admin123}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

app.jwt.secret=change-this-development-secret-key-to-a-long-random-value-123456789
app.jwt.expiration-ms=86400000

app.upload.dir=uploads/resumes

logging.level.org.springframework.security=INFO